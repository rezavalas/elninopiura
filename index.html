/* Pantalla de carga: hora de Lima, radar sobre Piura, Gotita que se mueve y avance real de la descarga */
(function () {
  var H = document.documentElement, d = new Date(Date.now() - 18e6), h = d.getUTCHours() + d.getUTCMinutes() / 60;
  H.setAttribute('data-hora', h >= 5.25 && h < 6.75 ? 'alba' : h >= 6.75 && h < 17.75 ? 'dia' : h >= 17.75 && h < 19 ? 'tarde' : 'noche');
  var ld = document.getElementById('arranque'), svg = document.getElementById('tb-mapa'), bar = document.getElementById('tb-barrido');
  var c = (svg.getAttribute('data-c') || '0 0').split(' ').map(Number), R = +svg.getAttribute('data-r') || 236;
  function ajustar() {   // el radar queda arriba en el celular y a la derecha en la computadora
    var w = innerWidth, hh = innerHeight, ancho = w >= 760, u = R / (Math.min(ancho ? w * .34 : w * .47, hh * (ancho ? .44 : .3)));
    var vw = w * u, vh = hh * u, x0 = c[0] - (ancho ? .64 : .5) * vw, y0 = c[1] - (ancho ? .5 : .3) * vh, dd = 2 * R / u;
    svg.setAttribute('viewBox', [x0, y0, vw, vh].map(function (v) { return Math.round(v * 10) / 10; }).join(' '));
    bar.style.width = bar.style.height = dd + 'px'; bar.style.left = ((c[0] - x0) / u - dd / 2) + 'px'; bar.style.top = ((c[1] - y0) / u - dd / 2) + 'px';
    ld.classList.add('tb-radar-on');
  }
  ajustar(); addEventListener('resize', ajustar);
  var sel = svg.querySelector('[data-blip="Piura"]'); if (sel) sel.classList.add('tbm-sel');
  var g = document.getElementById('ld-gota'), red = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches, k = 0;
  function hacer(a, ms) { if (red) return; g.classList.add('gx-a-' + a); setTimeout(function () { g.classList.remove('gx-a-' + a); }, ms); }
  hacer(H.getAttribute('data-hora') === 'noche' ? 'bosteza' : 'saluda', 2400);
  setInterval(function () { var L = ['salta', 'guina', 'saluda', 'somb']; hacer(L[k++ % 4], 1600); }, 2700);
  var est = document.getElementById('estado'), barI = document.getElementById('ld-i'), pct = document.getElementById('ld-pct'), p = 0;
  var MSJ = [[.1, 'Conectando con el tablero…'], [.35, 'Leyendo las estaciones del norte…'], [.6, 'Revisando el radar y el mar…'], [.85, 'Armando el pronóstico…'], [1, 'Revisando ríos y avisos…'], [2, '¡Listo!']];

    var m = MSJ.filter(function (e) { return p < e[0]; })[0][1]; if (p >= 1) m = '¡Listo!';

  };

  window.__ldEspera = setInterval(function () { window.__ldAvance(.12 * (1 - Math.exp(-(Date.now() - t0) / 2500))); }, 120);
  window.__ldFin = function (fn) { clearInterval(window.__ldEspera); window.__ldAvance(1); setTimeout(function () { ld.classList.add('listo'); setTimeout(fn, 330); }, 260); };

<script>
