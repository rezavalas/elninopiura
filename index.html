<script>
/* Abre el tablero: pide la página del día al programa de Google y la muestra. Si no hay señal, muestra la última guardada. */
(function () {
  var FUENTE = 'https://script.google.com/macros/s/AKfycbw8T7An5U4DaSiC_Y09sUnR-O33N62nmm-suhK9gvL8YxzC2Dq2pnpm19VusujyDMM1/exec?app=1';
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /[?&]prueba=1/.test(location.search)) FUENTE = 'prueba.html';
  var CACHE = 'tablero-contenido', CLAVE = './contenido/ultimo.html';
  // Chrome avisa que la app se puede instalar; se guarda el aviso para el botón «Instalar».
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__bip = e; });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  var CABEZA = '<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0B2545">'
    + '<link rel="icon" type="image/png" href="favicon-32.png"><link rel="apple-touch-icon" href="icono-180.png">'
    + '<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="El Niño Piura">';
  function guardar(txt) {
    if (!window.caches) return Promise.resolve();
    var listo = caches.open(CACHE).then(function (c) {
      return c.put(CLAVE, new Response(txt, { headers: { 'Content-Type': 'text/html; charset=utf-8', 'X-Guardado': new Date().toISOString() } }));
    }).catch(function () {});
    // se espera a que quede guardada (como mucho un segundo y medio) antes de cambiar la página
    return Promise.race([listo, new Promise(function (ok) { setTimeout(ok, 1500); })]);
  }
  function leer() {
    if (!window.caches) return Promise.resolve(null);
    return caches.open(CACHE).then(function (c) { return c.match(CLAVE); }).then(function (r) {
      return r ? r.text().then(function (t) { return { t: t, f: r.headers.get('X-Guardado') || '' }; }) : null;
    }).catch(function () { return null; });
  }
  function pintar(html, guardadoEl) {
    window.__APP_GUARDADO__ = guardadoEl || '';
    html = html.replace(/<head[^>]*>/i, function (m) { return m + CABEZA; });
    var pie = '<script src="app.js"><\/script>';
    html = /<\/body>/i.test(html) ? html.replace(/<\/body>/i, function () { return pie + '</body>'; }) : html + pie;
    document.open(); document.write(html); document.close();
  }
  function fallo() {
    document.getElementById('estado').textContent = 'No se pudo cargar el tablero. Revisa tu conexión a internet.';
    document.getElementById('barra').hidden = true;
    var b = document.getElementById('otra'); b.hidden = false; b.onclick = function () { location.reload(); };
  }
  function cargar() {
    var ctl = window.AbortController ? new AbortController() : null;
    var reloj = setTimeout(function () { if (ctl) ctl.abort(); }, 20000);
    fetch(FUENTE, { cache: 'no-store', signal: ctl ? ctl.signal : undefined }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function (txt) {
      clearTimeout(reloj);
      if (txt.length < 20000 || txt.indexOf('id="tb"') < 0) throw new Error('respuesta incompleta');
      guardar(txt).then(function () { pintar(txt, ''); });
    }).catch(function () {
      clearTimeout(reloj);
      leer().then(function (c) { if (c) pintar(c.t, c.f || 'antes'); else fallo(); });
    });
  }
  cargar();
})();
</script>
